<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" role="img" aria-label="Tech stack Starting XI in a 4-3-3 formation">
<defs>
 <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1128"/><stop offset="1" stop-color="#1c2541"/></linearGradient>
 <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd700" stop-opacity=".12"/><stop offset="1" stop-color="#ffd700" stop-opacity="0"/></linearGradient>
 <filter id="goldGlow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<!-- Background - dark elegant RM navy -->
<rect width="800" height="470" rx="14" fill="url(#pitch)"/>
<!-- Subtle grid pattern -->
<g stroke="#ffd700" stroke-opacity=".04" stroke-width="1">
  <line x1="0" y1="117" x2="800" y2="117"/><line x1="0" y1="235" x2="800" y2="235"/><line x1="0" y1="352" x2="800" y2="352"/>
  <line x1="200" y1="0" x2="200" y2="470"/><line x1="400" y1="0" x2="400" y2="470"/><line x1="600" y1="0" x2="600" y2="470"/>
</g>
<!-- Pitch markings - minimalistic white -->
<g stroke="#fff" stroke-opacity=".12" stroke-width="1.5" fill="none">
  <rect x="14" y="14" width="772" height="442"/>
  <line x1="400" y1="14" x2="400" y2="456"/>
  <circle cx="400" cy="235" r="50"/>
  <!-- Penalty areas -->
  <rect x="14" y="140" width="100" height="190"/>
  <rect x="686" y="140" width="100" height="190"/>
  <!-- Goal areas -->
  <rect x="14" y="190" width="40" height="90"/>
  <rect x="746" y="190" width="40" height="90"/>
</g>
<circle cx="400" cy="235" r="3" fill="#ffd700" opacity=".4"/>
<!-- Title pill -->
<rect x="290" y="22" width="220" height="28" rx="14" fill="#0a1128" fill-opacity=".9" stroke="#ffd700" stroke-width="1" stroke-opacity=".3"/>
<text x="400" y="41" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#ffd700">STARTING XI · 4-3-3</text>

<!-- ═══ GK ═══ -->
<circle cx="70" cy="235" r="24" fill="none" stroke="#ffd700" stroke-width="2" opacity=".9"/>
<circle cx="70" cy="235" r="22" fill="#0a1128" stroke="#ffd700" stroke-width="1.5"/>
<text x="70" y="240" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="800" fill="#ffd700">1</text>
<text x="70" y="270" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" fill="#ffffff" opacity=".85">Git</text>

<!-- ═══ DEFENDERS (4) ═══ -->
<!-- CB1 -->
<circle cx="200" cy="85" r="22" fill="#0a1128" stroke="#fff" stroke-width="1.5"/>
<text x="200" y="90" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="800" fill="#fff">3</text>
<text x="200" y="118" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" fill="#ffffff" opacity=".85">Linux</text>
<!-- CB2 -->
<circle cx="200" cy="185" r="22" fill="#0a1128" stroke="#fff" stroke-width="1.5"/>
<text x="200" y="190" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="800" fill="#fff">4</text>
<text x="200" y="218" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" fill="#ffffff" opacity=".85">Docker</text>
<!-- CB3 -->
<circle cx="200" cy="285" r="22" fill="#0a1128" stroke="#fff" stroke-width="1.5"/>
<text x="200" y="290" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="800" fill="#fff">5</text>
<text x="200" y="318" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" fill="#ffffff" opacity=".85">MongoDB</text>
<!-- CB4 -->
<circle cx="200" cy="385" r="22" fill="#0a1128" stroke="#fff" stroke-width="1.5"/>
<text x="200" y="390" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="800" fill="#fff">2</text>
<text x="200" y="418" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" fill="#ffffff" opacity=".85">SQL</text>

<!-- ═══ MIDFIELD (3) ═══ -->
<!-- CM1 -->
<circle cx="400" cy="120" r="22" fill="#0a1128" stroke="#fff" stroke-width="1.5"/>
<text x="400" y="125" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="800" fill="#fff">8</text>
<text x="400" y="153" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" fill="#ffffff" opacity=".85">FastAPI</text>
<!-- CM2 (captain - #10) -->
<circle cx="400" cy="235" r="22" fill="#0a1128" stroke="#fff" stroke-width="1.5"/>
<text x="400" y="240" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="800" fill="#fff">10</text>
<text x="400" y="268" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" fill="#ffffff" opacity=".85">Node.js</text>
<!-- CM3 -->
<circle cx="400" cy="350" r="22" fill="#0a1128" stroke="#fff" stroke-width="1.5"/>
<text x="400" y="355" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="800" fill="#fff">6</text>
<text x="400" y="383" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" fill="#ffffff" opacity=".85">TypeScript</text>

<!-- ═══ FORWARDS (3) ═══ -->
<!-- LW -->
<circle cx="620" cy="85" r="22" fill="#0a1128" stroke="#fff" stroke-width="1.5"/>
<text x="620" y="90" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="800" fill="#fff">11</text>
<text x="620" y="118" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" fill="#ffffff" opacity=".85">PyTorch</text>

<!-- ST (CR7 - Python) - STAR PLAYER with golden glow -->
<circle cx="640" cy="235" r="30" fill="none" stroke="#ffd700" stroke-width="1.5" opacity=".5">
  <animate attributeName="r" values="28;38;28" dur="2.5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".5;0;.5" dur="2.5s" repeatCount="indefinite"/>
</circle>
<circle cx="640" cy="235" r="24" fill="#ffd700" stroke="#fff" stroke-width="2"/>
<text x="640" y="241" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="900" fill="#0a1128">7</text>
<text x="640" y="270" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffd700">Python</text>

<!-- RW -->
<circle cx="620" cy="385" r="22" fill="#0a1128" stroke="#fff" stroke-width="1.5"/>
<text x="620" y="390" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="800" fill="#fff">9</text>
<text x="620" y="418" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" fill="#ffffff" opacity=".85">React</text>

<!-- Subtle RM branding hint at bottom -->
<text x="400" y="462" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="8" font-weight="600" letter-spacing="3" fill="#ffd700" opacity=".25">HALA MADRID</text>
</svg>
