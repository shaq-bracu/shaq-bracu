<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Shakhawat Hossain header">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1128"/><stop offset=".5" stop-color="#1c2541"/><stop offset="1" stop-color="#0a1128"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c4a35a"/><stop offset=".5" stop-color="#ffd700"/><stop offset="1" stop-color="#c4a35a"/></linearGradient>
 <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd700" stop-opacity=".15"/><stop offset="1" stop-color="#ffd700" stop-opacity="0"/></linearGradient>
 <linearGradient id="stripe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".08"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
 <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1a2e"/><stop offset="1" stop-color="#0a1128"/></linearGradient>
</defs>
<!-- Background -->
<rect width="1200" height="320" fill="url(#bg)"/>
<!-- Subtle diagonal RM stripes -->
<rect x="0" y="0" width="1200" height="320" fill="url(#stripe)" opacity=".4"/>
<polygon points="0,0 180,0 480,320 120,320" fill="url(#goldV)"/>
<polygon points="1200,0 1020,0 720,320 1080,320" fill="url(#goldV)"/>
<!-- Gold accent lines -->
<line x1="0" y1="0" x2="0" y2="320" stroke="#ffd700" stroke-width="3" stroke-opacity=".6"/>
<line x1="1200" y1="0" x2="1200" y2="320" stroke="#ffd700" stroke-width="3" stroke-opacity=".6"/>
<line x1="0" y1="0" x2="1200" y2="0" stroke="#ffd700" stroke-width="2" stroke-opacity=".3"/>
<!-- Subtle CR7 number -->
<text x="1140" y="260" text-anchor="end" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="320" fill="none" stroke="#ffd700" stroke-opacity=".08" stroke-width="2">7</text>
<!-- RM Crown hint - subtle -->
<g transform="translate(1060,30)" opacity=".12" fill="#ffd700">
  <polygon points="0,40 8,10 16,30 24,5 32,30 40,10 48,40"/>
  <rect x="0" y="40" width="48" height="6" rx="2"/>
</g>
<!-- Bottom bar - dark sophisticated stripe -->
<rect y="268" width="1200" height="52" fill="url(#pitch)"/>
<line x1="0" y1="268" x2="1200" y2="268" stroke="#ffd700" stroke-width="1.5" stroke-opacity=".5"/>
<!-- Pitch markings -->
<g stroke="#fff" stroke-opacity=".15" stroke-width="1.5" fill="none">
  <circle cx="600" cy="294" r="24"/>
  <line x1="600" y1="268" x2="600" y2="320"/>
</g>
<!-- Animated football -->
<g>
  <animateMotion dur="10s" repeatCount="indefinite" path="M -40 294 L 1240 294"/>
  <g><animateTransform attributeName="transform" type="rotate" from="0" to="1440" dur="10s" repeatCount="indefinite"/>
    <circle r="10" fill="#fff" stroke="#1a1a2e" stroke-width="1"/>
    <polygon points="0,-5 4.8,-1.5 3,-4 -3,-4 -4.8,-1.5" fill="#1a1a2e" opacity=".6"/>
  </g>
</g>
<!-- Text -->
<g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <text x="60" y="110" font-size="18" font-weight="700" letter-spacing="10" fill="#ffd700" opacity=".9">HALA MADRID. I AM</text>
  <text x="58" y="185" font-size="68" font-weight="800" fill="#ffffff">SHAKHAWAT HOSSAIN</text>
  <text x="60" y="228" font-size="20" font-weight="700" letter-spacing="5" fill="url(#gold)">SOFTWARE ENGINEER  ·  AI / ML  ·  FULL-STACK</text>
</g>
<!-- Animated gold shimmer line -->
<rect x="-200" y="267" width="120" height="2" fill="url(#gold)" opacity=".6">
  <animate attributeName="x" values="-200;1400" dur="4s" repeatCount="indefinite"/>
</rect>
</svg>
